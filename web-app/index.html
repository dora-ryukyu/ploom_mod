<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="description" content="Ploom Aura heating profile editor (Web Bluetooth)" />
  <title>Ploom Studio</title>
  <link rel="stylesheet" href="./style.css?v=v8ui" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <h1>Ploom Studio</h1>
        <span id="conn-badge" class="badge badge-off">OFF</span>
        <span id="deploy-stamp" class="deploy-stamp" title="deploy stamp">…</span>
      </div>
      <button id="btn-connect" class="btn primary" type="button">Connect</button>
    </header>

    <p class="caveat">
      <strong>Aura 検証済み</strong> — 他機種は未検証。本体は焼付 <strong>1 本</strong>のみ。
      step 時間は <strong>デバイス秒（0–255）</strong>。壁時計はそれより短い（目安 ×0.86）。
    </p>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-target="panel-profile" role="tab" aria-selected="true">Profile</button>
      <button type="button" class="tab" data-target="panel-device" role="tab" aria-selected="false">Device</button>
    </nav>

    <!-- Profile first -->
    <section id="panel-profile" class="panel active" role="tabpanel">
      <div class="card">
        <div class="toolbar">
          <select id="sel-preset" class="select grow" aria-label="Preset">
            <option value="">Preset…</option>
            <option value="Eco">Eco</option>
            <option value="Long">Long</option>
            <option value="SuperLong">SuperLong v8</option>
            <option value="Strong" disabled>Strong (empty)</option>
          </select>
          <label class="btn secondary btn-sm file-btn">
            JSON
            <input type="file" id="file-upload" accept=".json,application/json" hidden />
          </label>
          <button id="btn-export" class="btn secondary btn-sm" type="button" disabled>Export</button>
        </div>
        <div id="profile-meta" class="profile-meta muted">プリセットを選ぶか JSON を読み込んでください</div>
      </div>

      <div class="card chart-card">
        <div class="card-title-row">
          <h2>Heat curve</h2>
          <span id="chart-scale" class="muted tiny">°C · 幅＝時間</span>
        </div>
        <div id="heating-chart" class="heating-chart" aria-label="heating profile chart"></div>
        <div id="chart-legend" class="chart-legend muted tiny"></div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <h2>Steps</h2>
          <span id="steps-summary" class="muted tiny"></span>
        </div>
        <div id="steps-container" class="steps-container">
          <div class="empty-state">プロファイル未読込</div>
        </div>
      </div>

      <div class="card write-card">
        <label class="check-row">
          <input type="checkbox" id="chk-enable-write" />
          <span>書き込みを有効化（Apply / Reset）</span>
        </label>
        <button id="btn-apply" class="btn primary block" type="button" disabled>Apply</button>
        <div class="toolbar tight">
          <button id="btn-dryrun" class="btn secondary btn-sm" type="button" disabled>Dry-run</button>
          <button id="btn-copy-dry" class="btn secondary btn-sm" type="button" disabled>Copy hex</button>
          <button id="btn-reset" class="btn danger btn-sm" type="button" disabled>Reset Basic</button>
        </div>
        <details class="fold">
          <summary>Dry-run 出力</summary>
          <pre id="dryrun-output" class="dryrun">—</pre>
        </details>
      </div>
    </section>

    <!-- Device (secondary) -->
    <section id="panel-device" class="panel" role="tabpanel" hidden>
      <div class="card">
        <h2>Status</h2>
        <div class="status-grid">
          <div class="stat-box">
            <span class="stat-label">Model</span>
            <span class="stat-value" id="val-model">—</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Var 0x47</span>
            <span class="stat-value" id="val-version">—</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Gen</span>
            <span class="stat-value" id="val-gen">4</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Batt health</span>
            <span class="stat-value" id="val-health">—</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Lock</span>
            <span class="stat-value" id="val-lock">—</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Master</span>
            <span class="stat-value" id="val-master">0/20</span>
          </div>
        </div>
        <div class="toolbar tight" style="margin-top:12px">
          <label class="inline-label">Gen
            <select id="sel-gen" class="select">
              <option value="4" selected>4</option>
              <option value="3.1">3.1</option>
              <option value="3">3</option>
            </select>
          </label>
          <button id="btn-refresh-init" class="btn secondary btn-sm" type="button" disabled>Re-init</button>
          <button id="btn-vibe" class="btn secondary btn-sm" type="button" disabled>Vibe</button>
          <button id="btn-autostart" class="btn secondary btn-sm" type="button" disabled>AutoStart</button>
        </div>
      </div>

      <div class="card">
        <h2>Master (20)</h2>
        <div id="master-profile-grid" class="master-grid">
          <div class="empty-state">Connect 後に取得</div>
        </div>
      </div>

      <div class="card logs-card">
        <div class="card-title-row">
          <h2>BLE log</h2>
          <div class="toolbar tight">
            <button id="btn-copy-log" class="btn secondary btn-sm" type="button">Copy</button>
            <button id="btn-clear-log" class="btn secondary btn-sm" type="button">Clear</button>
          </div>
        </div>
        <pre id="log-output"></pre>
      </div>
    </section>
  </div>

  <script type="module" src="./main.js?v=v8ui"></script>
</body>
</html>
